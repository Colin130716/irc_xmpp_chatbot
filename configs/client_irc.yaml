client:
  name: irc_main
  type: irc
  bot_name: qsdwindows_bot
  server:
    host: 127.0.0.1
    port: 8443
    token: "change-me-shared-secret"
    tls:
      verify: false

irc:
  host: irc.example.com
  port: 6697
  tls: true
  tls_verify: true
  realname: "My IRC Bot"
  channels:
    - "#chan1"

llm:
  format: openai_chat
  base_url: "https://api.openai.com/v1"
  api_key: "sk-xxx"
  model: "gpt-4o-mini"
  system_prompt: "You are a helpful IRC bot."
  temperature: 0.7
  max_tokens: 1000
  timeout: 60
  max_reply_chars: 1500
